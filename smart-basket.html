<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F5E4B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="הסל החכם">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>הסל החכם</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Secular+One&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F4EF; --surface:#FFFFFF; --surface2:#E6EBE2; --text:#15231D; --muted:#5B6B62; --line:#D7DFD3;
  --primary:#0F5E4B; --on-primary:#FFFFFF; --tag:#FFD23F; --on-tag:#1B1A10; --rec:#E5412D;
  --good:#0E7A55; --good-bg:#DCF2E6; --warn:#7A4E00; --warn-bg:#FFEFC2; --bad:#B3261E;
  --shadow:0 1px 0 rgba(21,35,29,.05),0 8px 20px -10px rgba(21,35,29,.28);
  --display:'Secular One','Assistant',system-ui,sans-serif;
  --body:'Assistant','Heebo','Arial Hebrew',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light dark;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1613; --surface:#18221D; --surface2:#222E28; --text:#EAF0EC; --muted:#93A399; --line:#2A3831;
    --primary:#3DC79A; --on-primary:#06231A; --good:#4CD3A1; --good-bg:#12342A; --warn:#FFD98A; --warn-bg:#3A2E0E; --bad:#FF8A80;
    --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 20px -10px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#0F1613; --surface:#18221D; --surface2:#222E28; --text:#EAF0EC; --muted:#93A399; --line:#2A3831;
  --primary:#3DC79A; --on-primary:#06231A; --good:#4CD3A1; --good-bg:#12342A; --warn:#FFD98A; --warn-bg:#3A2E0E; --bad:#FF8A80;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 20px -10px rgba(0,0,0,.6);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.45;min-height:100vh}
body.has-nav #app{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
#app{max-width:520px;margin:0 auto;min-height:100vh;position:relative}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px;border-radius:8px}
h1,h2,h3,p{margin:0}
.disp{font-family:var(--display);font-weight:400;letter-spacing:0}
.muted{color:var(--muted)}
.pad{padding:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.sp{justify-content:space-between}
.center{text-align:center}
.sub{display:flex;gap:8px;flex-wrap:wrap;font-size:13.5px;color:var(--muted)}
.note{font-size:13px;color:var(--muted)}

/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:8px;padding:12px 12px 10px;border-bottom:1px solid var(--line)}
.hdr h1{font-family:var(--display);font-weight:400;font-size:22px;flex:1}
.ib{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:var(--text)}
.ib:hover{background:var(--surface2)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;background:var(--surface2);font-size:14px;font-weight:600}
.pill.demo{background:var(--warn-bg);color:var(--warn)}

/* buttons */
.cta{width:100%;min-height:52px;border-radius:16px;background:var(--primary);color:var(--on-primary);font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 18px}
.cta[disabled]{opacity:.45;cursor:not-allowed}
.cta.alt{background:var(--surface);color:var(--text);border:1.5px solid var(--line)}
.ghost{min-height:44px;border-radius:14px;padding:0 14px;font-weight:700;color:var(--primary);display:inline-flex;align-items:center;gap:6px}
.ghost.danger{color:var(--bad)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{min-height:40px;padding:0 13px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);font-weight:700}
.chip[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface2);border-radius:14px;padding:4px;gap:4px}
.seg button{min-height:42px;border-radius:11px;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:var(--shadow)}

/* forms */
label.f{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:14.5px}
.in,select.in,textarea.in{width:100%;min-height:48px;padding:10px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface)}
textarea.in{resize:vertical;line-height:1.5}
.card{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:14px}

/* shelf-tag price */
.pr{display:inline-flex;align-items:flex-start;direction:ltr;font-family:var(--display);line-height:1;white-space:nowrap}
.pr i{font-style:normal;font-size:.48em;margin-top:.12em;margin-inline-end:.12em}
.pr sup{font-size:.5em;margin-inline-start:.08em;margin-top:.02em}
.tag{display:inline-block;background:var(--tag);color:var(--on-tag);padding:.28em .6em .22em;
  clip-path:polygon(8px 0,calc(100% - 8px) 0,100% 8px,100% calc(100% - 8px),calc(100% - 8px) 100%,8px 100%,0 calc(100% - 8px),0 8px)}

.tag.plain{background:var(--surface2);color:var(--text)}
/* record */
.hero{display:flex;flex-direction:column;align-items:center;gap:18px;padding:22px 16px 6px}
.mic{width:172px;height:172px;border-radius:50%;background:var(--tag);color:var(--on-tag);display:grid;place-items:center;
  box-shadow:0 0 0 10px color-mix(in srgb,var(--tag) 30%,transparent),0 0 0 22px color-mix(in srgb,var(--tag) 14%,transparent),0 18px 30px -14px rgba(0,0,0,.45);transition:background .2s,color .2s}
.mic.on{background:var(--rec);color:#fff;animation:pulse 1.4s ease-in-out infinite}
.mic.sm{width:120px;height:120px}
@keyframes pulse{0%,100%{box-shadow:0 0 0 10px rgba(229,65,45,.3),0 0 0 22px rgba(229,65,45,.14)}50%{box-shadow:0 0 0 18px rgba(229,65,45,.2),0 0 0 34px rgba(229,65,45,.07)}}
@media (prefers-reduced-motion:reduce){.mic.on{animation:none}.spin{animation:none!important}}

/* aisle signs */
.aisle{display:flex;align-items:center;gap:10px;background:var(--cc,#666F6B);color:#fff;padding:9px 16px;font-weight:800;margin-top:14px}
.aisle .cnt{margin-inline-start:auto;background:rgba(255,255,255,.22);border-radius:99px;padding:1px 10px;font-size:13.5px}
.cat-fv{--cc:#2E8B47}.cat-meat{--cc:#C7372F}.cat-dairy{--cc:#2F72B8}.cat-bakery{--cc:#A86308}.cat-dry{--cc:#8B5E34}
.cat-frozen{--cc:#17798C}.cat-drinks{--cc:#5B4BD1}.cat-snacks{--cc:#C93A7E}.cat-clean{--cc:#147F6B}.cat-paper{--cc:#5F6B80}
.cat-baby{--cc:#C9591F}.cat-pharm{--cc:#8A47A6}.cat-other{--cc:#666F6B}
.it{display:flex;align-items:center;gap:10px;padding:11px 14px;background:var(--surface);border-bottom:1px solid var(--line);border-inline-start:6px solid var(--cc,#666);cursor:pointer;width:100%;text-align:start}
.it b{font-weight:800;font-size:17px}
.it.done b{text-decoration:line-through;color:var(--muted)}
.it.done{opacity:.6}
.qty{display:flex;align-items:center;gap:2px;background:var(--surface2);border-radius:14px}
.qty button{width:38px;height:40px;display:grid;place-items:center;border-radius:12px}
.qty span{min-width:54px;text-align:center;font-weight:800;font-size:15px}
.chk{width:30px;height:30px;border-radius:9px;border:2px solid var(--muted);display:grid;place-items:center;flex:none;color:transparent}
.done .chk{background:var(--good);border-color:var(--good);color:#fff}

/* compare */
.bcard{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:10px;width:100%;text-align:start;border:2px solid transparent}
.bcard.best{border-color:var(--good)}
.bcard .tot{font-size:40px}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:8px;padding:2px 9px;font-size:12.5px;font-weight:800;background:var(--surface2)}
.b-good{background:var(--good-bg);color:var(--good)}
.b-warn{background:var(--warn-bg);color:var(--warn)}
.b-club{background:#E7E0FA;color:#4630A8}
.b-sub{background:#FFE1D2;color:#9C3A0E}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .b-club{background:#2B2450;color:#CDBFFF}:root:not([data-theme="light"]) .b-sub{background:#4A2515;color:#FFC7AB}}
:root[data-theme="dark"] .b-club{background:#2B2450;color:#CDBFFF}:root[data-theme="dark"] .b-sub{background:#4A2515;color:#FFC7AB}
.ln{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;padding:12px 14px;background:var(--surface);border-bottom:1px solid var(--line)}
.ln.miss{background:var(--warn-bg)}
.ln .amt{font-family:var(--display);font-size:19px;white-space:nowrap;direction:ltr}

/* candidates */
.cand{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:16px;padding:13px 14px;width:100%;text-align:start;box-shadow:var(--shadow);border:2px solid transparent}
.cand:hover{border-color:var(--primary)}
.cand b{font-weight:800}

/* nav */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;justify-content:center;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.nav .in-nav{display:grid;grid-template-columns:repeat(4,1fr);width:100%;max-width:520px}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:12px;font-size:12.5px;font-weight:700;color:var(--muted);min-height:54px}
.nav button[aria-current="page"]{color:var(--primary)}

/* sheet, busy, toast */
.scrim{position:fixed;inset:0;background:rgba(10,18,14,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.busy{position:fixed;inset:0;z-index:60;background:rgba(10,18,14,.55);display:grid;place-items:center;color:#fff;font-weight:800;text-align:center}
.spin{width:44px;height:44px;border-radius:50%;border:5px solid rgba(255,255,255,.3);border-top-color:#fff;animation:sp .9s linear infinite;margin:0 auto 14px}
@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--text);color:var(--bg);padding:10px 18px;border-radius:14px;font-weight:700;z-index:70;max-width:90vw;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
.foot{position:sticky;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 70%,transparent);display:flex;gap:10px}
.demo-strip{background:var(--warn-bg);color:var(--warn);padding:8px 14px;font-size:13.5px;font-weight:700}
.empty{padding:36px 20px;text-align:center;color:var(--muted)}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px}
.sw input{width:24px;height:24px;accent-color:var(--primary)}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
/* =====================================================================
   הסל החכם – MVP
   שכבות: (1) נתונים וספקי מחירים  (2) זיהוי רשימה והתאמה  (3) ממשק
   כל נתוני המחירים והסניפים כאן הם נתוני הדגמה.
   ===================================================================== */

/* ---------- כלים ---------- */
const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 9);
const fmt = n => '₪' + (Math.round(n * 100) / 100).toFixed(2);
const money = n => '<bdi dir="ltr">' + fmt(n) + '</bdi>';
function priceTag(n, size) {
  const c = Math.round(n * 100), w = Math.floor(c / 100), a = String(c % 100).padStart(2, '0');
  return '<span class="pr" style="font-size:' + (size || 28) + 'px"><i>₪</i><b style="font-weight:400">' + w + '</b><sup>' + a + '</sup></span>';
}
function hash(str) { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0) / 4294967296; }
const norm = s => String(s || '').toLowerCase()
  .replace(/[\u0591-\u05C7]/g, '')
  .replace(/[׳'’`"״”“]/g, '')
  .replace(/[-–־_/]/g, ' ')
  .replace(/([^\d])\./g, '$1 ').replace(/\.(?!\d)/g, ' ')
  .replace(/[,;:!?()\[\]{}؟،]/g, ' ')
  .replace(/\s+/g, ' ').trim();
function lev(a, b) {
  if (a === b) return 0; const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
  let prev = Array.from({length: n + 1}, (_, i) => i);
  for (let i = 1; i <= m; i++) { const cur = [i]; for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j-1] + 1, prev[j-1] + (a[i-1] === b[j-1] ? 0 : 1)); prev = cur; }
  return prev[n];
}
const fmtQty = n => Number.isInteger(n) ? String(n) : String(Math.round(n * 100) / 100);

/* ---------- קטגוריות (לפי סדר המעברים בסופר) ---------- */
const CATS = [
  {k:'fv', n:'פירות וירקות'}, {k:'meat', n:'בשר, עוף ודגים'}, {k:'dairy', n:'מוצרי חלב וביצים'},
  {k:'bakery', n:'לחם ומאפים'}, {k:'dry', n:'מזון יבש ושימורים'}, {k:'frozen', n:'קפואים'},
  {k:'drinks', n:'שתייה'}, {k:'snacks', n:'חטיפים ומתוקים'}, {k:'clean', n:'ניקיון וכביסה'},
  {k:'paper', n:'נייר ומוצרים לבית'}, {k:'baby', n:'תינוקות'}, {k:'pharm', n:'טואלטיקה ופארם'}, {k:'other', n:'אחר'}
];
const CAT_NAME = Object.fromEntries(CATS.map(c => [c.k, c.n]));
const UNITS = ['יח׳', 'ק״ג', 'גרם', 'ליטר', 'שישייה', 'חבילה'];

/* ---------- משפחות מוצרים: מה המשתמש אומר -> איזה סוג מוצר ---------- */
const FAMS = {
  milk:{cat:'dairy', al:['חלב']}, cottage:{cat:'dairy', al:['קוטג׳','קוטג']}, yellow:{cat:'dairy', al:['גבינה צהובה','צהובה','גבינה צהובה פרוסות']},
  eggs:{cat:'dairy', al:['ביצים','ביצה']},
  chicken:{cat:'meat', al:['חזה עוף','חזה עוף טרי','חזה']}, beef:{cat:'meat', al:['בשר טחון','בקר טחון','בשר בקר טחון','טחון']},
  legs:{cat:'meat', al:['שוקיים','שוקי עוף','שוק עוף']}, schnitzel:{cat:'meat', al:['שניצל','שניצל עוף']},
  potato:{cat:'fv', al:['תפוחי אדמה','תפוח אדמה','תפוא']}, tomato:{cat:'fv', al:['עגבניות','עגבנייה','עגבניה']},
  cucumber:{cat:'fv', al:['מלפפונים','מלפפון']}, onion:{cat:'fv', al:['בצל','בצל יבש']}, apple:{cat:'fv', al:['תפוחי עץ','תפוח עץ','תפוחים']},
  banana:{cat:'fv', al:['בננות','בננה']}, carrot:{cat:'fv', al:['גזר']}, lettuce:{cat:'fv', al:['חסה']}, lemon:{cat:'fv', al:['לימון','לימונים']},
  pita:{cat:'bakery', al:['פיתות','פיתה']}, bread:{cat:'bakery', al:['לחם','לחם פרוס','לחם אחיד']}, buns:{cat:'bakery', al:['לחמניות','לחמנייה']},
  rice:{cat:'dry', al:['אורז']}, pasta:{cat:'dry', al:['פסטה','ספגטי','פנה']}, oil:{cat:'dry', al:['שמן','שמן קנולה']}, corn:{cat:'dry', al:['תירס']},
  tuna:{cat:'dry', al:['טונה']}, coffee:{cat:'dry', al:['קפה','קפה נמס','נס קפה']}, paste:{cat:'dry', al:['רסק עגבניות','רסק']},
  fschnitzel:{cat:'frozen', al:['שניצלוני','שניצלונים','שניצל קפוא']}, fveg:{cat:'frozen', al:['ירקות קפואים','אפונה וגזר','אפונה']}, icecream:{cat:'frozen', al:['גלידה']},
  cokezero:{cat:'drinks', al:['קולה זירו','קוקה קולה זירו','זירו','קולה דיאט','פפסי מקס']}, cola:{cat:'drinks', al:['קולה','קוקה קולה']},
  water:{cat:'drinks', al:['מים','מים מינרליים','שישיית מים']}, juice:{cat:'drinks', al:['מיץ','מיץ תפוזים']},
  chocolate:{cat:'snacks', al:['שוקולד']}, bamba:{cat:'snacks', al:['במבה']}, bissli:{cat:'snacks', al:['ביסלי','ביסלי גריל']},
  dish:{cat:'clean', al:['נוזל כלים','סבון כלים','פיירי']}, laundry:{cat:'clean', al:['אבקת כביסה','כביסה','אריאל']}, softener:{cat:'clean', al:['מרכך','מרכך כביסה']},
  bakingpaper:{cat:'paper', al:['נייר אפייה','נייר אפיה']}, foil:{cat:'paper', al:['נייר אלומיניום','אלומיניום','נייר כסף']},
  toilet:{cat:'paper', al:['נייר טואלט','טואלט']}, towel:{cat:'paper', al:['מגבות נייר','נייר מטבח','מגבת נייר']}, trash:{cat:'paper', al:['שקיות אשפה','שקיות זבל']},
  diapers:{cat:'baby', al:['חיתולים','טיטולים','פמפרס']}, wipes:{cat:'baby', al:['מגבונים','מגבונים לחים']},
  shampoo:{cat:'pharm', al:['שמפו']}, toothpaste:{cat:'pharm', al:['משחת שיניים','משחה']}, deodorant:{cat:'pharm', al:['דאודורנט','דיאודורנט']}, bodysoap:{cat:'pharm', al:['סבון גוף','סבון']}
};

/* ---------- קטלוג הדגמה ----------
   cat, family, שם, מותג, גודל, כמות באריזה (q), יחידת בסיס (ml/g/pc), אופן תמחור (kg = לפי משקל, pc = לאריזה), מחיר בסיס
   המזהים "DEMO-xxxx" מחליפים ברקוד אמיתי כשמחברים מקור נתונים אמיתי. */
const RAW = [
  ['dairy','milk','חלב 3%','תנובה','1 ליטר',1000,'ml','pc',6.9],
  ['dairy','milk','חלב 1%','תנובה','1 ליטר',1000,'ml','pc',6.9],
  ['dairy','milk','חלב 3%','טרה','1 ליטר',1000,'ml','pc',6.6],
  ['dairy','milk','חלב סויה','אלפרו','1 ליטר',1000,'ml','pc',13.9],

/* ---------- ספקי מחירים (שכבה מודולרית) ----------
   כל ספק חייב לממש: branchesNear(loc, km), product(id), price(branch, productId), updatedLabel(branch)
   כדי לעבור למקור אמיתי מחליפים רק את `provider`. */
const CHAINS = [
  {id:'a', name:'שוק העיר', f:0.98, miss:0.04},
  {id:'b', name:'סופר פלוס', f:1.03, miss:0.03},
  {id:'c', name:'מגה־דיל', f:0.94, miss:0.13},
  {id:'d', name:'פרש מרקט', f:1.08, miss:0.02}
];
const AREAS = ['מרכז', 'צפון', 'דרום', 'מזרח', 'מערב', 'התחנה', 'הים', 'הפארק', 'הקניון', 'העיר העתיקה', 'המרינה'];
const _bcache = {};
function haversine(a, b, c, d) {
  const R = 6371, t = x => x * Math.PI / 180, dLat = t(c - a), dLng = t(d - b);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(t(a)) * Math.cos(t(c)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function genBranches(lat, lng) {
  const seed = lat.toFixed(2) + '_' + lng.toFixed(2);
  if (_bcache[seed]) return _bcache[seed];
  const dists = [0.8, 1.6, 2.4, 3.3, 4.4, 5.8, 7.5, 9.6, 12.5, 16.5, 19];
  _bcache[seed] = dists.map((d, i) => {
    const ch = CHAINS[i % CHAINS.length], ang = hash(seed + 'b' + i) * 2 * Math.PI;
    const blat = lat + d * Math.cos(ang) / 111, blng = lng + d * Math.sin(ang) / (111 * Math.cos(lat * Math.PI / 180));
    return {id:ch.id + '-' + seed + '-' + i, chain:ch, name:ch.name + ' ' + AREAS[(i * 3 + Math.floor(hash(seed + 'n') * 5)) % AREAS.length],
      lat:blat, lng:blng, minsAgo:20 + Math.floor(hash(seed + 'u' + i) * 600)};
  });
  return _bcache[seed];
}
const DemoProvider = {
  id:'demo', label:'נתוני הדגמה', isDemo:true,
  branchesNear(loc, km) {
    return genBranches(loc.lat, loc.lng).map(b => Object.assign({}, b, {dist:haversine(loc.lat, loc.lng, b.lat, b.lng)}))
      .filter(b => b.dist <= km).sort((a, b) => a.dist - b.dist);
  },
  product(id) { return PMAP.get(id) || null; },
  price(br, pid) {
    const p = PMAP.get(pid); if (!p) return null;
    if (hash(br.id + pid + 'm') < br.chain.miss) return null;
    const noise = 1 + (hash(br.id + pid + 'n') - 0.5) * 0.10;
    const price = Math.max(0.9, Math.round(p.base * br.chain.f * noise * 10) / 10);
    const r = {price, promo:null}, h = hash(br.id + pid + 'p');
    if (h < 0.13) r.promo = {kind:'sale', price:Math.round(price * 0.85 * 10) / 10};
    else if (h < 0.22) r.promo = {kind:'club', price:Math.round(price * 0.80 * 10) / 10};
    else if (h < 0.28 && p.sell === 'pc') r.promo = {kind:'multi', n:2, bundle:Math.round(price * 2 * 0.85 * 10) / 10};
    return r;
  },
  updatedLabel(br) { const m = br.minsAgo; return 'עודכן לפני ' + (m < 90 ? m + ' דקות' : Math.round(m / 60) + ' שעות') + ' (הדגמה)'; }
};

async function govSearchProducts(query) {
  const toks = norm(query).split(' ').filter(t => t.length >= 2).slice(0, 4);
  if (!toks.length) return [];
  const enc = encodeURIComponent;
  const fields = 'select=id,barcode,name,brand,size_label,size_amount,size_unit,sell_by,category,family';
  // תיקון (גילוי בבדיקה בפועל): ILIKE %token% לבד מחזיר מאות תוצאות (כולל התאמות
  // בתוך מילים ארוכות יותר כמו חלבון/חלבה), וכשהתוצאות ממוינות אלפביתית ומוגבלות
  // ל-limit קטן, המוצרים הרלוונטיים האמיתיים (חלב 3% וכו') נדחקים הרחק מעבר לגבול
  // ולא מגיעים בכלל. במקום זה בונים תנאי "גבול מילה" (word boundary) בצד השרת.
  function wordBoundaryConds(t) {
    return [`name.ilike.${enc(t + ' *')}`, `name.ilike.${enc('* ' + t + ' *')}`, `name.ilike.${enc('* ' + t)}`, `name.eq.${enc(t)}`];
  }
  function substrConds(t) { return [`name.ilike.${enc('*' + t + '*')}`]; }
  function buildFilter(condsFn, tokens) {
    const groups = tokens.map(t => { const c = condsFn(t); return c.length > 1 ? `or(${c.join(',')})` : c[0]; });
    if (groups.length === 1) {
      const c = condsFn(tokens[0]);
      return c.length > 1 ? `or=(${c.join(',')})` : c[0];
    }
    return `and=(${groups.join(',')})`;
  }
  async function fetchTier(filterPart, limit, excludeIds) {
    let qs = `${fields}&limit=${limit}&order=name.asc&${filterPart}`;
    if (excludeIds.size) qs += `&id=not.in.(${[...excludeIds].join(',')})`;
    return await sbFetch('/rest/v1/products?' + qs) || [];
  }
  const excludeIds = new Set();
  let results = await fetchTier(buildFilter(wordBoundaryConds, toks), 60, excludeIds);
  results.forEach(r => excludeIds.add(r.id));
  if (results.length < 10) {
    const more = await fetchTier(buildFilter(substrConds, toks), 20, excludeIds);
    results = results.concat(more);
  }
  // מיון סופי: התאמת המילה הראשונה בשם עדיפה (זה מה שאדם מצפה לראות ראשון),
  // אחריה התאמת מילה שלמה בכל מיקום, ולבסוף שאר ההתאמות
  function scoreOf(r) {

      if (words[0] === t) score += 10 - idx;
      else if (words.includes(t)) score += 5 - idx;
      else if (words.some(w => w.startsWith(t))) score += 1;
    });
    return score;
  }
  results.sort((a, b) => scoreOf(b) - scoreOf(a) || (a.name || '').length - (b.name || '').length);
  const top = results.slice(0, 20);
  top.forEach(r => GOV.products.set(String(r.id), mapGovProduct(r)));
  return top.map(r => GOV.products.get(String(r.id)));
}

}

}

const NUMW = {'אחד':1,'אחת':1,'שני':2,'שתי':2,'שניים':2,'שתיים':2,'שלוש':3,'שלושה':3,'ארבע':4,'ארבעה':4,'חמש':5,'חמישה':5,'שש':6,'שישה':6,'שבע':7,'שבעה':7,'שמונה':8,'תשע':9,'תשעה':9,'עשר':10,'עשרה':10,'חצי':0.5,'רבע':0.25};

function segmentize(text) {
  const out = [];
  const clean = String(text).replace(/\.(\s|$)/g, ',').replace(/[\n;،]+/g, ',');
  for (const chunk of clean.split(',')) {
    let cur = [];
    for (const w of chunk.trim().split(/\s+/).filter(Boolean)) {
      const n = norm(w);
      if (!n || STOP.has(n)) continue;
      if (n === 'ו') { if (cur.length) out.push(cur.join(' ')); cur = []; continue; }
      if (w.length > 2 && w[0] === 'ו' && cur.length) {
        const rest = norm(w.slice(1));
        if (VOCAB.has(rest) || NUMW[rest] !== undefined || /^\d/.test(rest)) { out.push(cur.join(' ')); cur = [w.slice(1)]; continue; }

  }

}

    const raw = toks[i], t = norm(raw); if (!t) continue;
    if (t === 'של') { brand = toks.slice(i + 1).join(' '); break; }
    const isNum = /^\d+(\.\d+)?$/.test(t) || NUMW[t] !== undefined;
    if (isNum) {
      const val = NUMW[t] !== undefined ? NUMW[t] : parseFloat(t), nu = UNITW[norm(toks[i + 1] || '')];

        if (nu === 'ליטר' || nu === 'מ״ל') { size = val + ' ' + nu; i++; continue; }
        qty = val; if (nu) { unit = nu; i++; } continue;
      }
      if (nu) { size = val + ' ' + nu; i++; continue; }
      name.push(raw); continue;
    }
    if (UNITW[t]) { if (!unit) unit = UNITW[t]; if (qty === null) qty = 1; continue; }

}

function qtyMult(it, p) {
  const u = it.unit, q = +it.qty || 1;
  if (p.sell === 'kg') return u === 'גרם' ? q / 1000 : q;
  if (u === 'ק״ג' && p.u === 'g') return Math.max(1, Math.round(q * 1000 / p.q));
  if (u === 'גרם' && p.u === 'g') return Math.max(1, Math.round(q / p.q));
  if (u === 'ליטר' && p.u === 'ml') return Math.max(1, Math.round(q * 1000 / p.q));
  return q;
}
function lineCost(pr, mult, hasClub) {
  let total = pr.price * mult, tag = null, locked = false, note = '';

  if (pm) {
    if (pm.kind === 'sale') { total = pm.price * mult; tag = 'מבצע'; }
    else if (pm.kind === 'club') {
      if (hasClub) { total = pm.price * mult; tag = 'מחיר מועדון'; }
      else { locked = true; tag = 'מחיר מועדון'; note = 'עם כרטיס מועדון: ' + fmt(pm.price * mult); }
    } else if (pm.kind === 'multi') {
      const b = Math.floor(mult / pm.n);
      if (b > 0) { total = b * pm.bundle + (mult - b * pm.n) * pr.price; tag = pm.n + ' ב־' + fmt(pm.bundle); }
      else note = 'מבצע: ' + pm.n + ' ב־' + fmt(pm.bundle);
    }
  }
  return {total, tag, locked, note};
}

    const pr = provider.price(br, q.id); if (!pr) continue;

    const up = unitPrice(q, eff), d = base && up ? Math.abs(up.v - base.v) : 0;
    if (!best || d < best.d) best = {p:q, eff, up, d};
  }
  return best;
}

  const prod = items.filter(i => i.productId && !i.skip);

      if (!pr) return {it, p, mult, missing:true, sub:findSub(br, p), total:0};

    });

      missing:lines.filter(l => l.missing).length, promos:lines.filter(l => !l.missing && l.tag && !l.locked).length};
  });
  rows.sort((a, b) => (a.missing > 0) - (b.missing > 0) || (a.missing && b.missing ? a.missing - b.missing : 0) || a.total - b.total);
  const best = rows.find(r => !r.missing) || null;

}

    const A = rows[a], B = rows[b]; let total = 0, ok = true, na = 0, nb = 0; const pick = [];

      '<button class="pill" data-a="goLoc">' + icon('pin', 18) + (S.loc ? esc(S.loc.city) + ', ' + S.radius + ' ק״מ' : 'בחירת מיקום') + '</button></div>' +

      '<h2 class="disp" style="font-size:24px">הקלטת רשימת קניות</h2><button class="ghost" data-a="openRecType">' + icon('kb', 20) + 'או הקלידו את הרשימה</button></div>' +
      '<div class="pad stack">' +
      (n ? '<button class="card row sp" data-a="goReview" style="text-align:start"><div><b>רשימה בעריכה</b><p class="muted">' + n + ' מוצרים מחכים לך</p></div>' + icon('fwd') + '</button>' : '') +
      (last ? '<button class="card row sp" data-a="tab" data-v="lists" style="text-align:start"><div><b>הרשימה האחרונה</b><p class="muted">' + esc(last.title) + ', ' + last.items.length + ' מוצרים</p></div>' + icon('fwd') + '</button>' : '') +
      (S.staples.length ? '<button class="card row sp" data-a="addStaples" style="text-align:start"><div><b>להוסיף את המוצרים הקבועים</b><p class="muted">' + S.staples.length + ' מוצרים ברשימת הקבועים</p></div>' + icon('plus') + '</button>' : '') +

  record() {

      '<p id="recstatus" class="muted center" style="min-height:24px">' + esc(S.rec.on ? 'מקשיבים… אמרו את כל הרשימה במשפט אחד' : (S.rec.err || 'לחצו על הכפתור והקריאו את הרשימה')) + '</p></div>' +
      (has ? '<p class="note center">כבר יש ' + has + ' מוצרים ברשימה. מה שתאמרו עכשיו יתווסף אליהם.</p>' : '') +

  },
  review() {
    const items = S.draft.items;
    let body = '';
    if (!items.length) body = '<div class="empty"><p>הרשימה ריקה.</p><p style="margin-top:8px">אפשר להקליט, או להוסיף מוצר כאן למעלה.</p></div>';
    else for (const c of CATS) {
      const g = items.filter(i => i.cat === c.k); if (!g.length) continue;
      body += '<section class="' + catClass(c.k) + '"><div class="aisle"><span>' + esc(c.n) + '</span><span class="cnt">' + g.length + '</span></div>' +
        g.map(it => {
          const st = stepOf(it), sub = [it.brand, it.size].filter(Boolean).map(x => '<span>' + esc(x) + '</span>').join('');
          return '<div class="it' + (it.checked ? ' done' : '') + '" role="button" tabindex="0" data-a="' + (S.shop ? 'tick' : 'edit') + '" data-id="' + it.id + '">' +
            (S.shop ? '<span class="chk">' + icon('check', 18) + '</span>' : '') +
            '<div class="grow"><b>' + esc(it.name) + '</b>' + (sub ? '<div class="sub">' + sub + '</div>' : '') + '</div>' +
            (S.shop ? '<span class="muted" style="font-weight:800">' + esc(qtyLabel(it)) + '</span>' :
              '<div class="qty"><button data-a="' + (it.qty <= st ? 'del' : 'dec') + '" data-id="' + it.id + '" aria-label="' + (it.qty <= st ? 'מחיקה' : 'הפחתה') + '">' + icon(it.qty <= st ? 'trash' : 'minus', 18) + '</button><span>' + esc(qtyLabel(it)) + '</span><button data-a="inc" data-id="' + it.id + '" aria-label="הוספה">' + icon('plus', 18) + '</button></div>') +
            '</div>';
        }).join('') + '</section>';
    }
    const done = items.filter(i => i.checked).length;
    return hdr('הרשימה שלך', true, '<button class="ghost" data-a="newList">רשימה חדשה</button>') + '<main>' +
      '<div class="pad stack" style="padding-bottom:4px"><div class="seg" role="group"><button data-a="mode" data-v="edit" aria-pressed="' + !S.shop + '">עריכה</button><button data-a="mode" data-v="shop" aria-pressed="' + S.shop + '">בזמן קנייה</button></div>' +
      (S.draft.mode ? '<p class="note">' + (S.draft.mode === 'ai' ? 'הרשימה פורקה בעזרת AI. כדאי לעבור עליה.' : 'הרשימה פורקה בזיהוי מקומי (בלי AI). כדאי לעבור עליה.') + '</p>' : '') +
      (S.shop ? '<p class="note">סומנו ' + done + ' מתוך ' + items.length + '. הרשימה מסודרת לפי סדר המעברים בסופר.</p>' :
        '<div class="row"><input id="quick" class="in grow" placeholder="הוסיפו מוצר, למשל: שלוש שישיות מים" data-a-enter="quickAdd"><button class="ib" style="background:var(--primary);color:var(--on-primary)" data-a="quickAdd" aria-label="הוספה">' + icon('plus') + '</button></div>') +
      '</div>' + body + '<div style="height:96px"></div></main>' +
      '<div class="foot" style="position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto">' +
      '<button class="cta alt" style="flex:0 0 auto;width:auto" data-a="saveList" ' + (items.length ? '' : 'disabled') + '>שמירה</button><button class="cta" data-a="ready" ' + (items.length ? '' : 'disabled') + '>הרשימה מוכנה</button></div>';
  },
  match() {
    const m = S.match, it = S.draft.items.find(i => i.id === m.queue[m.i]);
    if (!it) return '';
    const list = m.results || [];
    return hdr('איזה מוצר בדיוק?', true, '<span class="pill">' + (m.i + 1) + ' מתוך ' + m.queue.length + '</span>') + '<main class="pad stack">' +
      '<div><h2 class="disp" style="font-size:26px">' + esc(it.name) + '</h2><p class="muted">כמות: ' + esc(qtyLabel(it)) + (it.brand ? ', מותג: ' + esc(it.brand) : '') + '</p></div>' +
      '<p class="note">בחרו את המוצר שמתאים. ההשוואה בין סניפים תיעשה על אותו מוצר בדיוק. מחיר ליחידת מידה מופיע כדי להשוות בין גדלים שונים, כשהמידע קיים.</p>' +
      (m.loading ? '<div class="empty card">מחפשים מוצרים בסניפים הקרובים…</div>' :
        list.length ? list.map(x => '<button class="cand" data-a="pick" data-p="' + x.p.id + '"><div class="grow"><b>' + esc(x.p.name) + '</b><div class="sub">' + (x.p.brand ? '<span>' + esc(x.p.brand) + '</span>' : '<span>ללא מותג</span>') + (x.p.size ? '<span>' + esc(x.p.size) + '</span>' : '') + '</div></div>' +
          '<div style="text-align:end">' + (x.mn != null ? '<span class="tag">' + priceTag(x.mn, 22) + '</span><div class="note" style="margin-top:4px">הכי זול באזור' + (unitLabel(x.p, x.mn) ? ', ' + unitLabel(x.p, x.mn) : '') + '</div>' : '<span class="note">לא נמצא מחיר בסניפים באזור</span>') + '</div></button>').join('') :
        '<div class="empty card">לא נמצא מוצר תואם במאגר הרשמי. אפשר לנסות מילה אחרת (למשל שם המותג בלבד) או לדלג.</div>') +
      '<label class="f">לא מצאתם? חפשו לפי שם אחר<input id="msearch" class="in" placeholder="למשל: עגבניות שרי" value="' + esc(m.q || '') + '" data-in="mq" data-a-enter="msearch"></label>' +
      '<button class="cta alt" data-a="skipItem">לדלג על המוצר (לא ייכלל בהשוואה)</button></main>';
  },
  compare() {
    const R = S.result;
    const head = hdr('השוואת הסל', true) + demoStrip();
    const ctl = '<div class="pad stack" style="padding-bottom:0"><div class="seg" role="group"><button data-a="cmp" data-v="single" aria-pressed="' + (S.cmp === 'single') + '">סניף אחד</button><button data-a="cmp" data-v="split" aria-pressed="' + (S.cmp === 'split') + '">פיצול בין שני סניפים</button></div>' +
      radiusChips() + '<label class="sw"><span>יש לי כרטיס מועדון של הרשת</span><input type="checkbox" data-ch="club" ' + (S.hasClub ? 'checked' : '') + '></label></div>';
    if (!R.rows.length) return head + ctl + '<div class="empty"><p>לא נמצאו סניפים ב־' + S.radius + ' ק״מ.</p><p style="margin-top:8px">נסו להגדיל את הרדיוס.</p></div>';
    const skipped = R.skipped ? '<p class="note">' + R.skipped + ' מוצרים לא נכללו בהשוואה (דולגו או לא נמצאו).</p>' : '';
    if (S.cmp === 'split') return head + ctl + '<main class="pad stack">' + skipped + splitHtml(R.split) + '</main>';
    const cards = R.rows.map((r, idx) => {
      const isBest = R.best && r === R.best, diff = R.best && !isBest && !r.missing ? r.total - R.best.total : null;
      return '<button class="bcard' + (isBest ? ' best' : '') + '" data-a="detail" data-id="' + esc(r.br.id) + '">' +
        '<div class="row sp"><div><b style="font-size:18px">' + esc(r.br.name) + '</b><p class="muted" style="font-size:14px">' + r.dist.toFixed(1) + ' ק״מ ממך</p></div>' +
        (isBest ? '<span class="tag disp" style="font-size:14px">הזול ביותר</span>' : '') + '</div>' +
        '<div class="row sp" style="align-items:flex-end"><span class="tag' + (isBest ? '' : ' plain') + '">' + priceTag(r.total, isBest ? 44 : 32) + '</span>' +
        (diff != null ? '<span class="badge b-warn">יקר ב־' + fmt(diff) + '</span>' : '') + (r.missing ? '<span class="badge b-warn">סכום חלקי</span>' : '') + '</div>' +
        '<div class="row" style="flex-wrap:wrap;gap:6px">' +
        (r.missing ? '<span class="badge b-warn">חסרים ' + r.missing + ' מוצרים</span>' : '<span class="badge b-good">כל המוצרים במלאי</span>') +
        (r.promos ? '<span class="badge b-good">' + r.promos + ' במבצע</span>' : '') + '</div>' +
        '<p class="note">' + esc(provider.updatedLabel(r.br)) + '</p></button>';
    }).join('');
    const bestNote = !R.best ? '<div class="card b-warn" style="background:var(--warn-bg);color:var(--warn)"><b>אין סניף שמחזיק את כל המוצרים.</b><p>הסכומים חלקיים. אפשר לנסות פיצול בין שני סניפים או להגדיל רדיוס.</p></div>' : '';
    return head + ctl + '<main class="pad stack">' + skipped + bestNote + cards + '</main>';
  },
  detail() {
    const r = S.result.rows.find(x => x.br.id === S.detail); if (!r) return hdr('פירוט', true);
    const subs = r.lines.filter(l => l.missing && l.sub);
    const subTotal = S.incSubs ? subs.reduce((s, l) => s + l.sub.eff * l.mult, 0) : 0;
    const rows = r.lines.map(l => {
      if (l.missing) {
        const s = l.sub;
        return '<div class="ln miss"><div class="grow"><b>' + esc(l.p.name) + '</b><div class="sub"><span>' + esc(l.p.brand || 'ללא מותג') + '</span><span>' + esc(l.p.size) + '</span></div>' +
          '<span class="badge b-warn" style="margin-top:6px">חסר בסניף</span>' +
          (s ? '<div style="margin-top:8px"><span class="badge b-sub">תחליף</span> <b>' + esc(s.p.name) + '</b> <span class="sub" style="display:inline-flex">' + esc(s.p.brand) + ' ' + esc(s.p.size) + '</span>' +
            '<div class="note">' + money(s.eff) + ' ליחידה' + (s.up ? ', ' + unitLabel(s.p, s.eff) : '') + (unitPrice(l.p, l.p.base) ? ' (המוצר שבחרת: ' + unitLabel(l.p, l.p.base) + ' בקירוב)' : '') + '</div></div>' : '<p class="note" style="margin-top:6px">אין תחליף זמין בסניף.</p>') + '</div>' +
          '<div class="amt">' + (s && S.incSubs ? fmt(s.eff * l.mult) : '—') + '</div></div>';
      }
      const bad = (l.tag ? '<span class="badge ' + (l.tag === 'מחיר מועדון' ? 'b-club' : 'b-good') + '">' + esc(l.tag) + (l.locked ? ' (נדרש כרטיס)' : '') + '</span>' : '');
      const eff = l.pr.promo && l.tag && !l.locked && l.pr.promo.kind !== 'multi' ? l.pr.promo.price : l.pr.price;
      return '<div class="ln"><div class="grow"><b>' + esc(l.p.name) + '</b><div class="sub"><span>' + esc(l.p.brand || 'ללא מותג') + '</span><span>' + esc(l.p.size) + '</span></div>' +
        '<div class="note">' + esc(fmtQty(l.mult)) + (l.p.sell === 'kg' ? ' ק״ג' : ' יח׳') + ' במחיר ' + money(eff) + (l.p.sell === 'kg' ? ' לק״ג' : '') + (l.p.sell !== 'kg' && unitPrice(l.p, eff) ? ', ' + unitLabel(l.p, eff) : '') + (eff !== l.pr.price ? ' (מחיר רגיל ' + money(l.pr.price) + ')' : '') + '</div>' +
        (bad ? '<div style="margin-top:6px">' + bad + '</div>' : '') + (l.note ? '<div class="note" style="margin-top:4px">' + esc(l.note) + '</div>' : '') + '</div><div class="amt">' + fmt(l.total) + '</div></div>';
    }).join('');
    return hdr(r.br.name, true) + demoStrip() + '<main><div class="pad stack"><div class="row sp" style="align-items:flex-end"><div><p class="muted">' + r.dist.toFixed(1) + ' ק״מ ממך</p><p class="note">' + esc(provider.updatedLabel(r.br)) + '</p></div>' +
      '<span class="tag">' + priceTag(r.total + subTotal, 42) + '</span></div>' +
      (r.missing ? '<div class="card" style="background:var(--warn-bg);color:var(--warn)"><b>חסרים ' + r.missing + ' מוצרים בסניף הזה.</b><p>הסכום חלקי. תחליפים הם מוצרים אחרים, ולא נספרים בסכום אלא אם מפעילים את המתג.</p>' +
        '<label class="sw"><span>כלול תחליפים בסכום</span><input type="checkbox" data-ch="subs" ' + (S.incSubs ? 'checked' : '') + '></label></div>' : '') +
      (!S.hasClub && r.lines.some(l => l.locked) ? '<p class="note">חלק מהמחירים בסניף הם מחירי מועדון ולא נספרו. אפשר להפעיל “יש לי כרטיס מועדון” במסך ההשוואה.</p>' : '') + '</div>' + rows + '<div style="height:24px"></div></main>';
  },
  lists() {
    const cards = S.lists.map(l => '<div class="card stack" style="gap:8px"><div class="row sp"><div><b>' + esc(l.title) + '</b><p class="muted">' + l.items.length + ' מוצרים</p></div></div>' +

  },

  },
  settings() {
    const prov = PROVIDERS.map(p => '<div class="row" style="align-items:flex-start"><span class="badge ' + (p.status === 'active' ? 'b-good' : p.status === 'blocked' ? 'b-warn' : '') + '" style="flex:none">' + (p.status === 'active' ? 'פעיל' : p.status === 'blocked' ? 'חסום' : 'מתוכנן') + '</span><div><b style="font-size:15px">' + esc(p.label) + '</b><p class="note">' + esc(p.note) + '</p></div></div>').join('');
    return hdr('הגדרות ושיתוף') + '<main class="pad stack">' +
      '<div class="card stack"><b>חשבון</b><p class="muted">' + (S.user ? esc(S.user.name || 'אורח') + (S.user.email ? ', ' + esc(S.user.email) : '') : 'לא מחובר') + '</p><button class="ghost" style="align-self:flex-start" data-a="logout">יציאה</button></div>' +
      '<div class="card stack"><b>מיקום ורדיוס</b><p class="muted">' + (S.loc ? esc(S.loc.city) : 'לא נבחר') + '</p><button class="ghost" style="align-self:flex-start" data-a="goLoc">שינוי מיקום</button>' + radiusChips() +
      '<label class="sw"><span>יש לי כרטיס מועדון של הרשת</span><input type="checkbox" data-ch="club" ' + (S.hasClub ? 'checked' : '') + '></label></div>' +

  if (k === 'city') { const c = CITIES.find(x => x.n === t.value); if (c) { S.loc = {city:c.n, lat:c.lat, lng:c.lng, src:'city'}; persist(); render(); } }
  else if (k === 'club') { S.hasClub = t.checked; persist(); if (S.result) S.result = computeResults(S.draft.items, S.loc, S.radius, S.hasClub); render(); }
  else if (k === 'subs') { S.incSubs = t.checked; render(); }
});

/* ---------- הפעלה ---------- */
if (typeof document !== 'undefined' && !window.__SB_TEST__) {
  restore();
  S.view = !S.user ? 'auth' : !S.loc ? 'location' : 'home';
  render();
}
</script>
</body>
