# מיקום בריפו: .github/workflows/sync-prices.yml
name: Sync supermarket prices

on:
  schedule:
    - cron: "0 */4 * * *"   # כל 4 שעות. אפשר לשנות.
  workflow_dispatch: {}       # מאפשר הרצה ידנית מכפתור "Run workflow"

jobs:
  sync:
    runs-on: ubuntu-latest
    # הועלה מ-30 ל-45 דקות: מאז שתיקנו את מיפוי הכתובות, שלב הסניפים
    # מעבד מאות כתובות אמיתיות (לעומת 3-4 קודם), וכל אחת עוברת גיאוקוד
    # מול Nominatim שמוגבל לבקשה אחת בשנייה - זה לבד יכול להוסיף כמה
    # דקות. 30 דקות כמעט לא הספיקו גם לשלב המחירים לבדו בריצה האחרונה.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ENABLED_CHAINS: "RAMI_LEVY,OSHER_AD,YOHANANOF,YAYNO_BITAN_AND_CARREFOUR"
        run: python sync_prices.py
